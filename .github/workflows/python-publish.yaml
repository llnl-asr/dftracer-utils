name: Upload Python Package

on:
  release:
    types: [published]
  # Every merge into develop publishes a <tag>.postN.dev0 prerelease.
  push:
    branches: [develop]
    paths:
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - 'cmake/**'
      - 'src/**'
      - 'include/**'
      - 'python/**'
      - 'web/**'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  # A develop push that lands exactly on a tag is a release: python-publish
  # runs for it through the release event, so the push run must not upload it.
  check:
    name: Check the commit is not a tagged release
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "push" ] || ! git describe --tags --exact-match --match 'v*' >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  build_wheels:
    name: Build wheels on ${{ matrix.os }} (cp${{ matrix.python }})
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-14]
        python: ["38", "39", "310", "311", "312", "313", "314"]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select newer Xcode (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Prepare ccache dir
        run: mkdir -p "${{ github.workspace }}/.ccache"

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-wheel-v2-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-wheel-v2-${{ matrix.os }}-

      - name: Cache CPM dependency sources
        uses: actions/cache@v5
        with:
          path: .cpmsource
          key: cpmsource-full-v1-${{ hashFiles('cmake/modules/Dependencies.cmake') }}
          restore-keys: |
            cpmsource-full-v1-

      # Build the web UI on the host (needs Node) so cibuildwheel's CMake embed
      # step bakes the real page into dftracer_server instead of a placeholder.
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Resolve the pre-release version
        # scikit-build-core never runs setup.py, so the .postN.dev0 scheme the
        # sibling repos set there cannot be expressed in pyproject: a custom
        # version_scheme needs a registered entry point. Hand it over instead.
        run: |
          described=$(git describe --tags --long --match 'v*')
          tag=${described%-*-g*}
          distance=${described#"$tag"-}
          distance=${distance%-g*}
          tag=${tag#v}
          if [ "$distance" = "0" ]; then v="$tag"; else v="$tag.post$distance.dev0"; fi
          echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DFTRACER_UTILS=$v" >> "$GITHUB_ENV"
          echo "building version $v"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_BUILD: cp${{ matrix.python }}-*
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_* *-manylinux_ppc64le *-manylinux_s390x"
          CIBW_CONFIG_SETTINGS: "cmake.define.DFTRACER_UTILS_LOCAL_PACKAGES=OFF"
          CIBW_BEFORE_ALL_LINUX: "yum install -y epel-release ccache || dnf install -y epel-release ccache || true"
          CIBW_BEFORE_ALL_MACOS: "brew install ccache || true"
          CIBW_CONTAINER_ENGINE: "docker; create_args: --volume=${{ github.workspace }}/.ccache:/ccache"
          # The container does not inherit the host env, so the version must be passed in.
          CIBW_ENVIRONMENT_PASS_LINUX: SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DFTRACER_UTILS
          CIBW_ENVIRONMENT_LINUX: >-
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DFTRACER_UTILS=$SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DFTRACER_UTILS CCACHE_DIR=/ccache CCACHE_BASEDIR=/project
            CCACHE_COMPILERCHECK=content CCACHE_NOHASHDIR=true CCACHE_MAXSIZE=900M
            CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale
          CIBW_ENVIRONMENT_MACOS: >-
            SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DFTRACER_UTILS=$SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DFTRACER_UTILS CCACHE_DIR=$GITHUB_WORKSPACE/.ccache CCACHE_BASEDIR=$GITHUB_WORKSPACE
            CCACHE_COMPILERCHECK=content CCACHE_NOHASHDIR=true CCACHE_MAXSIZE=900M
            CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale

      - name: Check wheel payload
        run: |
          python3 -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet pytest
          /tmp/wheelcheck/bin/pytest tests/python/test_wheel_contents.py -q

      - uses: actions/upload-artifact@v6.0.0
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.12"

      # Ship the built UI in the sdist too, so source installs embed the real
      # page (sdist.include forces web/dist/index.html in).
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Resolve the pre-release version
        run: |
          described=$(git describe --tags --long --match 'v*')
          tag=${described%-*-g*}
          distance=${described#"$tag"-}
          distance=${distance%-g*}
          tag=${tag#v}
          if [ "$distance" = "0" ]; then v="$tag"; else v="$tag.post$distance.dev0"; fi
          echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DFTRACER_UTILS=$v" >> "$GITHUB_ENV"
          echo "building version $v"

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v6.0.0
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  deploy:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          # A re-run of the same commit would otherwise fail on an existing file.
          skip-existing: true
