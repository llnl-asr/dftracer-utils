# Converted from .github/workflows/{ci.yml,format-check.yaml}, which stay
# authoritative for GitHub. One 1-node Flux allocation per pipeline, found by
# job name; every phase runs in podman through `flux proxy`.
#
#   changes -> .code-paths      test      -> ci (os x python collapsed)
#   format-check.yaml           valgrind-* -> ci (one phase, one build)
#   wheel   -> wheels           coveralls, web, python-publish -> GitHub only
#
# develop and tags publish into the shared dldl distribution tree.

# A branch push pipelines alongside the merge request's, taking the
# allocation twice.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never

variables:
  # Keeps the checkout, and so the wheels built in it, on the workspace
  # filesystem. $USER is not expanded in `variables:`; $GITLAB_USER_LOGIN is.
  CUSTOM_CI_BUILDS_DIR: "/usr/workspace/$GITLAB_USER_LOGIN/gitlab-runner-builds"
  CUSTOM_CI_ENV_DIR: "/usr/workspace/$GITLAB_USER_LOGIN/gitlab-runner-envs"
  # wheels.sh versions from `git describe`. The default shallow fetch hides the
  # tags once develop moves past them, and the build fails outright.
  GIT_DEPTH: 0

stages: [alloc, test, publish, deploy, cleanup]

# Mirrors the `code` filter in .github/workflows/ci.yml.
.code-paths: &code-paths
  - CMakeLists.txt
  - CMakePresets.json
  - pyproject.toml
  - Makefile
  - include/**/*
  - src/**/*
  - tests/**/*
  - python/**/*
  - cmake/**/*
  - scripts/**/*
  - .gitlab-ci.yml
  - .gitlab/**/*

.corona-flux:
  id_tokens:
    SITE_ID_TOKEN:
      aud: https://lc.llnl.gov/gitlab
  tags: [shell, corona]
  variables:
    # A job variable, not a shell one: release-allocation must see it too, or
    # the allocation leaks. Distinct per pipeline, so no state file.
    ALLOC_NAME: "dftracer-utils-ci-$CI_PIPELINE_ID"
    # pbatch, not pdebug: the wheel job builds seven cpython versions and the
    # whole pipeline shares one allocation, which does not fit 60m.
    LARGE_QUEUE: pbatch
    LARGE_QUEUE_WALLTIME: 480

.always-rules: &always-rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'

.code-rules: &code-rules
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *code-paths
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *code-paths

allocate:
  extends: .corona-flux
  stage: alloc
  <<: *always-rules
  script:
    # A retry must not leave the previous attempt running.
    - for id in $(flux jobs -n --name="$ALLOC_NAME" -o "{id}" 2>/dev/null); do echo "cancelling stale allocation $id"; flux cancel "$id" || true; done
    - flux alloc --bg -N 1 -q "$LARGE_QUEUE" -t "${LARGE_QUEUE_WALLTIME}m" --job-name="$ALLOC_NAME"
    - JOBID=$(flux jobs -n --name="$ALLOC_NAME" -o "{id}" | head -1)
    - test -n "$JOBID"
    - echo "Created Flux allocation $JOBID (shared by all CI jobs)"

format-check:
  extends: .corona-flux
  stage: test
  needs: [allocate]
  <<: *always-rules
  script:
    - JOBID=$(flux jobs -n --name="$ALLOC_NAME" -o "{id}" | head -1)
    - test -n "$JOBID"
    - flux proxy "$JOBID" flux run -N 1 bash .gitlab/ci/run-in-podman.sh docker.io/library/python:3.11 .gitlab/ci/format-check.sh

ci:
  extends: .corona-flux
  stage: test
  needs: [allocate]
  <<: *code-rules
  timeout: 3h
  script:
    - JOBID=$(flux jobs -n --name="$ALLOC_NAME" -o "{id}" | head -1)
    - test -n "$JOBID"
    # One container per phase, run concurrently in the single allocation.
    # ubuntu:24.04, not 22.04: presets v6 needs CMake >= 3.25, 22.04 ships 3.22.
    - bash .gitlab/ci/parallel-phases.sh test-cpp test-py valgrind-cpp valgrind-py valgrind-mpi
  # On failure, keep the diagnostics: the per-PID Valgrind logs (full
  # stacktraces) and the CTest temporary logs. Bind-mounted to the checkout, so
  # they survive the phase containers.
  artifacts:
    name: "ci-logs-$CI_JOB_ID"
    when: on_failure
    expire_in: 1 week
    paths:
      - build/valgrind-logs/
      - build/**/Testing/Temporary/

docs:
  extends: .corona-flux
  stage: test
  needs: [allocate]
  <<: *always-rules
  script:
    - JOBID=$(flux jobs -n --name="$ALLOC_NAME" -o "{id}" | head -1)
    - test -n "$JOBID"
    - flux proxy "$JOBID" flux run -N 1 bash .gitlab/ci/run-in-podman.sh docker.io/library/python:3.12 .gitlab/ci/docs.sh
  artifacts:
    paths: [public]

wheels:
  extends: .corona-flux
  stage: publish
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *code-paths
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # No changes filter: whatever develop publishes has to be a matched set,
    # or the docs would carry a version with no wheels behind it.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
  timeout: 3h
  script:
    - JOBID=$(flux jobs -n --name="$ALLOC_NAME" -o "{id}" | head -1)
    - test -n "$JOBID"
    # Not run-in-podman.sh: cibuildwheel drives podman itself.
    - flux proxy "$JOBID" flux run -N 1 bash .gitlab/ci/wheels.sh
  artifacts:
    paths: [wheelhouse/*]

# Shares dftracer's wheels directory, so one --find-links resolves both.
distribute:
  extends: .corona-flux
  stage: deploy
  needs: [docs, wheels, {job: ci, optional: true}]
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
  script:
    - bash .gitlab/ci/distribute.sh

release-allocation:
  extends: .corona-flux
  stage: cleanup
  # No `needs:`: a job declaring them is skipped when one fails, leaking the
  # allocation. `when` belongs in the rules, or it is overridden by them.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
  script:
    - for id in $(flux jobs -n --name="$ALLOC_NAME" -o "{id}" 2>/dev/null); do echo "cancelling $id"; flux cancel "$id" || true; done
