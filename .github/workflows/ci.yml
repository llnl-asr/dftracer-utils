name: CI

on:
  push:
    branches:
      [main, develop, initialize, "feat/**", "fix/**", "chore/**", "perf/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3.0.2
        id: filter
        with:
          filters: |
            code:
              - 'include/**'
              - 'src/**'
              - 'tests/**'
              - 'python/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'pyproject.toml'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      CMAKE_POLICY_VERSION_MINIMUM: 3.5
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.run_id }}
          restore-keys: |
            ccache-v2-${{ matrix.os }}-${{ matrix.python-version }}-
            ccache-v2-${{ matrix.os }}-

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ccache lcov zlib1g-dev libsqlite3-dev pkg-config ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          for f in cmake ccache lcov zlib sqlite pkg-config ninja; do
            if brew list --versions "$f" >/dev/null; then
              echo "$f already installed"
            else
              brew install "$f"
            fi
          done

      - name: Run coverage
        if: (matrix.os == 'ubuntu-22.04' || matrix.os == 'macos-latest') && matrix.python-version == '3.12'
        run: |
          make coverage

      - name: Run test (Unix)
        if: "!((matrix.os == 'ubuntu-22.04' || matrix.os == 'macos-latest') && matrix.python-version == '3.12')"
        run: |
          make test

      - name: Run Python tests (with venv)
        if: "!((matrix.os == 'ubuntu-22.04' || matrix.os == 'macos-latest') && matrix.python-version == '3.12')"
        run: |
          if [ "${{ runner.os }}" = "Linux" ] && [ "${{ matrix.python-version }}" = "3.12" ]; then
            make test-py RUN_TY=1
          else
            make test-py
          fi

      - name: Upload coverage reports to Coveralls
        if: (matrix.os == 'ubuntu-22.04' || matrix.os == 'macos-latest') && matrix.python-version == '3.12'
        uses: coverallsapp/github-action@v2.3.6
        continue-on-error: true
        with:
          file: coverage/coverage_filtered.info
          format: lcov
          flag-name: ${{ matrix.os }}
          parallel: true
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

  coverage-finish:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls finished
        uses: coverallsapp/github-action@v2.3.6
        continue-on-error: true
        with:
          parallel-finished: true
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

  wheel:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Wheel build (deps from source) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@v6

      - name: Select newer Xcode (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Build and test wheel
        uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_BUILD: cp312-*
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_* *-manylinux_aarch64 *-manylinux_ppc64le *-manylinux_s390x"
          CIBW_CONFIG_SETTINGS: "cmake.define.DFTRACER_UTILS_LOCAL_PACKAGES=OFF"
