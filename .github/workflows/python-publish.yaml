name: Upload Python Package

on:
  release:
    types: [published]
  # Every merge into develop publishes a <tag>.postN.dev0 prerelease.
  push:
    branches: [develop]
    paths:
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - 'cmake/**'
      - 'src/**'
      - 'include/**'
      - 'python/**'
      - 'web/**'
      - 'VERSION'
  # A manual run skips the path filter above, so a CI-only fix can be run. From
  # develop it also publishes; from another branch it only builds.
  workflow_dispatch:
permissions:
  contents: read

jobs:
  # A develop push that lands exactly on a tag is a release: python-publish
  # runs for it through the release event, so the push run must not upload it.
  check:
    name: Check the commit is not a tagged release
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "push" ] || ! git describe --tags --exact-match --match 'v*' >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  # The wheels build with Release dependencies, restored from the R2 bucket
  # that the CI wheel jobs fill.
  wheel-linux:
    needs: check
    if: needs.check.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/wheel.yml
    secrets: inherit
    with:
      os: ubuntu-22.04
      publish: true

  wheel-linux-arm:
    needs: check
    if: needs.check.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/wheel.yml
    secrets: inherit
    with:
      os: ubuntu-22.04-arm
      publish: true

  wheel-macos:
    needs: check
    if: needs.check.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/wheel.yml
    secrets: inherit
    with:
      os: macos-14
      publish: true

  # The C and C++ install layout per platform, for the GitHub pre-release.
  package-linux:
    needs: check
    if: needs.check.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml
    secrets: inherit
    with:
      os: ubuntu-22.04
      name: linux-x86_64

  package-linux-arm:
    needs: check
    if: needs.check.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml
    secrets: inherit
    with:
      os: ubuntu-22.04-arm
      name: linux-aarch64

  package-macos:
    needs: check
    if: needs.check.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml
    secrets: inherit
    with:
      os: macos-14
      name: macos-arm64

  build_sdist:
    name: Build source distribution
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.12"

      # Ship the built UI in the sdist too, so source installs embed the real
      # page (sdist.include forces web/dist/index.html in).
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Resolve the pre-release version
        run: |
          described=$(git describe --tags --long --match 'v*')
          tag=${described%-*-g*}
          distance=${described#"$tag"-}
          distance=${distance%-g*}
          tag=${tag#v}
          if [ "$distance" = "0" ]; then v="$tag"; else v="$tag.post$distance.dev0"; fi
          echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DFTRACER_UTILS=$v" >> "$GITHUB_ENV"
          echo "building version $v"

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v6.0.0
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  deploy:
    name: Publish to PyPI
    needs: [wheel-linux, wheel-linux-arm, wheel-macos, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          # A re-run of the same commit would otherwise fail on an existing file.
          skip-existing: true

  # A develop push publishes a GitHub pre-release for its commit, and moves the
  # "develop-latest" pre-release to it. GitHub needs a tag per release, so only
  # the ten newest "pre-" releases are kept and their tags go with them. No tag
  # starts with "v": the version scheme runs git describe on v* tags. GITHUB_TOKEN events do not start other workflows, so
  # this does not trigger the release event.
  github-prerelease:
    name: Publish a GitHub pre-release
    needs: [deploy, package-linux, package-linux-arm, package-macos]
    runs-on: ubuntu-latest
    if: github.event_name != 'release' && github.ref == 'refs/heads/develop'
    permissions:
      contents: write
    concurrency:
      group: github-prerelease
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: package
          merge-multiple: true

      - name: Create the pre-release
        run: |
          described=$(git describe --tags --long --match 'v*')
          tag=${described%-*-g*}
          distance=${described#"$tag"-}
          distance=${distance%-g*}
          version="${tag#v}.post$distance.dev0"
          (cd package && sha256sum *.tar.gz > SHA256SUMS)
          gh release create "pre-$version" dist/* package/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "$version (${GITHUB_SHA::8})" \
            --notes "Built from $GITHUB_SHA on develop. PyPI version: $version."

      - name: Move develop-latest to this commit
        run: |
          described=$(git describe --tags --long --match 'v*')
          tag=${described%-*-g*}
          distance=${described#"$tag"-}
          distance=${distance%-g*}
          version="${tag#v}.post$distance.dev0"
          gh release delete develop-latest --cleanup-tag --yes || true
          gh release create develop-latest dist/* package/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "develop-latest: $version (${GITHUB_SHA::8})" \
            --notes "Latest build of develop, from $GITHUB_SHA. PyPI version: $version."

      - name: Delete pre-releases beyond the ten newest
        run: |
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("pre-")))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done

  # A published release gets the C and C++ packages too. SHA256SUMS lets the
  # VS Code extension verify its download.
  release-assets:
    name: Attach the C/C++ packages to the release
    needs: [package-linux, package-linux-arm, package-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: package
          merge-multiple: true

      - name: Upload to the release
        run: |
          (cd package && sha256sum *.tar.gz > SHA256SUMS)
          gh release upload "${{ github.event.release.tag_name }}" package/* --clobber \
            --repo "$GITHUB_REPOSITORY"
