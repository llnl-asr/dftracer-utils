name: CI

on:
  push:
    branches:
      [main, develop, initialize, "feat/**", "fix/**", "chore/**", "perf/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the default in scripts/ci/build_rocksdb.sh.
  ROCKSDB_VERSION: "10.10.1"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      coverage: ${{ steps.filter.outputs.coverage }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3.0.2
        id: filter
        with:
          filters: |
            code:
              - 'include/**'
              - 'src/**'
              - 'tests/**'
              - 'python/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'pyproject.toml'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            coverage:
              - 'scripts/coverage.sh'

  # Build RocksDB once per platform. The prefix is absolute and identical in
  # every consumer: the PCH embeds <rocksdb/*.h>, so a differing -I path would
  # invalidate ccache for the whole project.
  rocksdb:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.coverage == 'true'
    name: RocksDB prebuild (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Prepare deps dir
        run: |
          sudo mkdir -p /opt/dftracer-deps
          sudo chown "$(id -u):$(id -g)" /opt/dftracer-deps

      - name: Compiler fingerprint
        id: fp
        run: echo "cc=$(c++ --version | head -1 | tr -c '[:alnum:].' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore RocksDB
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: /opt/dftracer-deps
          key: rocksdb-v1-${{ matrix.os }}-${{ env.ROCKSDB_VERSION }}-${{ steps.fp.outputs.cc }}-${{ hashFiles('scripts/ci/build_rocksdb.sh') }}

      - name: Install build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential cmake ninja-build zlib1g-dev libzstd-dev
          else
            brew install ninja zstd || true
          fi

      - name: Build RocksDB
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/ci/build_rocksdb.sh

      - name: Save RocksDB
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /opt/dftracer-deps
          key: rocksdb-v1-${{ matrix.os }}-${{ env.ROCKSDB_VERSION }}-${{ steps.fp.outputs.cc }}-${{ hashFiles('scripts/ci/build_rocksdb.sh') }}

  test:
    needs: [changes, rocksdb]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.coverage == 'true'
    env:
      CMAKE_POLICY_VERSION_MINIMUM: 3.5
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 700M
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale
      CCACHE_NOHASHDIR: "true"

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python-version: "3.12" }
          - { os: ubuntu-22.04-arm, python-version: "3.12" }
          - { os: ubuntu-24.04, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.12" }

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prepare deps dir
        run: |
          sudo mkdir -p /opt/dftracer-deps
          sudo chown "$(id -u):$(id -g)" /opt/dftracer-deps

      - name: Compiler fingerprint
        id: fp
        run: echo "cc=$(c++ --version | head -1 | tr -c '[:alnum:].' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore RocksDB
        uses: actions/cache/restore@v5
        with:
          path: /opt/dftracer-deps
          key: rocksdb-v1-${{ matrix.os }}-${{ env.ROCKSDB_VERSION }}-${{ steps.fp.outputs.cc }}-${{ hashFiles('scripts/ci/build_rocksdb.sh') }}

      - name: Use prebuilt RocksDB
        run: |
          prefix="/opt/dftracer-deps/rocksdb-${ROCKSDB_VERSION}"
          if [ -x "${prefix}/bin/ldb" ]; then
            echo "DFTRACER_UTILS_ROCKSDB_PREFIX=${prefix}" >> "$GITHUB_ENV"
          else
            echo "::warning::no prebuilt RocksDB at ${prefix}; building from source"
          fi

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v4-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-v4-${{ matrix.os }}-

      - name: Cache CPM dependency sources
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cpmsource
          key: cpmsource-lite-v1-${{ hashFiles('cmake/modules/Dependencies.cmake') }}
          restore-keys: |
            cpmsource-lite-v1-

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ccache lcov zlib1g-dev libsqlite3-dev pkg-config ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          for f in cmake ccache lcov zlib sqlite pkg-config ninja; do
            if brew list --versions "$f" >/dev/null; then
              echo "$f already installed"
            else
              brew install "$f"
            fi
          done

      - name: ccache stats (reset)
        run: ccache -z || true

      - name: Run coverage
        if: (matrix.os == 'ubuntu-22.04' || matrix.os == 'macos-latest') && matrix.python-version == '3.12'
        run: |
          make coverage

      - name: Run test (Unix)
        if: "!((matrix.os == 'ubuntu-22.04' || matrix.os == 'macos-latest') && matrix.python-version == '3.12')"
        run: |
          make test

      - name: Run Python tests (with venv)
        if: "!((matrix.os == 'ubuntu-22.04' || matrix.os == 'macos-latest') && matrix.python-version == '3.12')"
        run: |
          if [ "${{ runner.os }}" = "Linux" ] && [ "${{ matrix.python-version }}" = "3.12" ]; then
            make test-py RUN_TY=1
          else
            make test-py
          fi

      - name: Trust Coveralls Homebrew tap (macOS)
        if: runner.os == 'macOS' && matrix.python-version == '3.12'
        run: |
          brew tap coverallsapp/coveralls || true
          brew trust coverallsapp/coveralls \
            || brew trust --formula coverallsapp/coveralls/coveralls || true

      - name: Upload coverage reports to Coveralls
        if: (matrix.os == 'ubuntu-22.04' || matrix.os == 'macos-latest') && matrix.python-version == '3.12'
        uses: coverallsapp/github-action@v2.3.6
        continue-on-error: true
        with:
          file: coverage/coverage_filtered.info
          format: lcov
          flag-name: ${{ matrix.os }}
          parallel: true
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

      - name: ccache stats (show)
        if: always()
        run: ccache -s || echo "ccache not available"

      - name: Save ccache
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v4-${{ matrix.os }}-${{ github.run_id }}

  coverage-finish:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls finished
        uses: coverallsapp/github-action@v2.3.6
        continue-on-error: true
        with:
          parallel-finished: true
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

  valgrind-cpp:
    needs: [changes, rocksdb]
    if: needs.changes.outputs.code == 'true'
    name: Valgrind (C++ and MPI)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CMAKE_POLICY_VERSION_MINIMUM: 3.5
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 700M
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale
      CCACHE_NOHASHDIR: "true"
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpmsource
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare deps dir
        run: |
          sudo mkdir -p /opt/dftracer-deps
          sudo chown "$(id -u):$(id -g)" /opt/dftracer-deps

      - name: Compiler fingerprint
        id: fp
        run: echo "cc=$(c++ --version | head -1 | tr -c '[:alnum:].' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore RocksDB
        uses: actions/cache/restore@v5
        with:
          path: /opt/dftracer-deps
          key: rocksdb-v1-ubuntu-24.04-${{ env.ROCKSDB_VERSION }}-${{ steps.fp.outputs.cc }}-${{ hashFiles('scripts/ci/build_rocksdb.sh') }}

      - name: Use prebuilt RocksDB
        run: |
          prefix="/opt/dftracer-deps/rocksdb-${ROCKSDB_VERSION}"
          if [ -x "${prefix}/bin/ldb" ]; then
            echo "DFTRACER_UTILS_ROCKSDB_PREFIX=${prefix}" >> "$GITHUB_ENV"
          else
            echo "::warning::no prebuilt RocksDB at ${prefix}; building from source"
          fi

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-valgrind-cpp-${{ github.run_id }}
          restore-keys: |
            ccache-valgrind-cpp-
            ccache-valgrind-
            ccache-v4-ubuntu-24.04-

      - name: Cache CPM dependency sources
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cpmsource
          key: cpmsource-lite-v1-${{ hashFiles('cmake/modules/Dependencies.cmake') }}
          restore-keys: |
            cpmsource-lite-v1-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache valgrind gdb \
            zlib1g-dev libsqlite3-dev pkg-config libopenmpi-dev openmpi-bin

      - name: ccache stats (reset)
        run: ccache -z || true

      - name: C++ tests under Valgrind
        run: make valgrind-cpp

      - name: MPI tests under Valgrind
        run: make valgrind-mpi

      - name: ccache stats (show)
        if: always()
        run: ccache -s || true

      - name: Save ccache
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-valgrind-cpp-${{ github.run_id }}

      - name: Upload Valgrind logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-cpp-logs
          path: build/valgrind-logs/
          if-no-files-found: ignore

  valgrind-python:
    needs: [changes, rocksdb]
    if: needs.changes.outputs.code == 'true'
    name: Valgrind (Python, full suite incl. dask)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CMAKE_POLICY_VERSION_MINIMUM: 3.5
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 700M
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale
      CCACHE_NOHASHDIR: "true"
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpmsource

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Prepare deps dir
        run: |
          sudo mkdir -p /opt/dftracer-deps
          sudo chown "$(id -u):$(id -g)" /opt/dftracer-deps

      - name: Compiler fingerprint
        id: fp
        run: echo "cc=$(c++ --version | head -1 | tr -c '[:alnum:].' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore RocksDB
        uses: actions/cache/restore@v5
        with:
          path: /opt/dftracer-deps
          key: rocksdb-v1-ubuntu-24.04-${{ env.ROCKSDB_VERSION }}-${{ steps.fp.outputs.cc }}-${{ hashFiles('scripts/ci/build_rocksdb.sh') }}

      - name: Use prebuilt RocksDB
        run: |
          prefix="/opt/dftracer-deps/rocksdb-${ROCKSDB_VERSION}"
          if [ -x "${prefix}/bin/ldb" ]; then
            echo "DFTRACER_UTILS_ROCKSDB_PREFIX=${prefix}" >> "$GITHUB_ENV"
          else
            echo "::warning::no prebuilt RocksDB at ${prefix}; building from source"
          fi

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-valgrind-py-${{ github.run_id }}
          restore-keys: |
            ccache-valgrind-py-
            ccache-valgrind-
            ccache-v4-ubuntu-24.04-

      - name: Cache CPM dependency sources
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cpmsource
          key: cpmsource-lite-v1-${{ hashFiles('cmake/modules/Dependencies.cmake') }}
          restore-keys: |
            cpmsource-lite-v1-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache valgrind \
            zlib1g-dev libsqlite3-dev pkg-config python3-dev

      - name: ccache stats (reset)
        run: ccache -z || true

      - name: Python tests under Valgrind
        run: make valgrind-py

      - name: ccache stats (show)
        if: always()
        run: ccache -s || true

      - name: Save ccache
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-valgrind-py-${{ github.run_id }}

      - name: Upload Valgrind logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-python-logs
          path: build/valgrind-logs/
          if-no-files-found: ignore

  wheel:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Wheel build (deps from source) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select newer Xcode (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Prepare ccache dir
        run: mkdir -p "${{ github.workspace }}/.ccache"

      - name: Restore ccache (wheel)
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-wheel-v2-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-wheel-v2-${{ matrix.os }}-

      - name: Cache CPM dependency sources
        uses: actions/cache@v5
        with:
          path: .cpmsource
          key: cpmsource-full-v1-${{ hashFiles('cmake/modules/Dependencies.cmake') }}
          restore-keys: |
            cpmsource-full-v1-

      - name: Build and test wheel
        uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_* *-manylinux_ppc64le *-manylinux_s390x"
          CIBW_CONFIG_SETTINGS: "cmake.define.DFTRACER_UTILS_LOCAL_PACKAGES=OFF"
          CIBW_BEFORE_ALL_LINUX: "yum install -y epel-release ccache || dnf install -y epel-release ccache || true"
          CIBW_BEFORE_ALL_MACOS: "brew install ccache || true"
          CIBW_BEFORE_BUILD: "ccache -s || echo 'WARNING: ccache unavailable - build is uncached'"
          CIBW_CONTAINER_ENGINE: "docker; create_args: --volume=${{ github.workspace }}/.ccache:/ccache"
          CIBW_ENVIRONMENT_LINUX: >-
            CCACHE_DIR=/ccache CCACHE_BASEDIR=/project
            CCACHE_COMPILERCHECK=content CCACHE_NOHASHDIR=true CCACHE_MAXSIZE=900M
            CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale
          CIBW_ENVIRONMENT_MACOS: >-
            CCACHE_DIR=$GITHUB_WORKSPACE/.ccache CCACHE_BASEDIR=$GITHUB_WORKSPACE
            CCACHE_COMPILERCHECK=content CCACHE_NOHASHDIR=true CCACHE_MAXSIZE=900M
            CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale

      - name: Reclaim ccache ownership
        if: always() && runner.os == 'Linux'
        run: sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}/.ccache" || true

      - name: Report ccache size
        if: always()
        run: du -sh .ccache 2>/dev/null || echo "no .ccache dir (uncached)"

      - name: Save ccache (wheel)
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-wheel-v2-${{ matrix.os }}-${{ github.run_id }}
