[project]
name = "dftracer-utils"
dynamic = ["version"]
description = "Python binding for dftracer-utils"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Ray Andrew Sinurat", email = "raydreww@gmail.com" },
  { name = "Hariharan Devarajan (Hari)", email = "hariharandev1@llnl.gov" },
]
dependencies = [
  # ParamSpec / TypeVarTuple used in the typed wrappers land in typing only at
  # 3.10 / 3.11; typing_extensions backports them for older interpreters.
  "typing_extensions; python_version < '3.11'",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
dftracer_plugin = "dftracer.utils.plugin_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=6.0",
  "hypothesis>=6.0",
  "ruff",
  "pyarrow>=16",
  "numpy",
  "scipy",
  "pandas",
  # pandas needs pytz; pin away from the broken 2026.3.post1 empty release.
  "pytz>=2024.1,<2026",
  "dask[bag,dataframe,distributed]>=2024.1.0; python_version >= '3.9'",
  "dask_jobqueue~=0.8.0; python_version >= '3.9'",
]

[build-system]
requires = ["scikit-build-core >=0.10"]
build-backend = "scikit_build_core.build"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "CMakePresets.json" },
  { file = "cmake/**/*.cmake" },
  { file = "cmake/modules/**/*.cmake" },
  { file = "include/**/*.h" },
  { file = "src/**/*.h" },
  { file = "src/**/*.cpp" },
  { file = "python/**/*.py" },
  { file = "python/**/*.pyi" },
]

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
minimum-version = "build-system.requires"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Package discovery
wheel.packages = ["python/dftracer"]

wheel.exclude = [
  "dftracer/lib/cmake/**",
  "dftracer/lib/pkgconfig/**",
  "dftracer/lib/*.a",
  "share/**",
]
sdist.include = [
  "python/dftracer/utils/_version.py",
  "python/dftracer/utils/py.typed",
  "cmake/tests",
  "web/dist/index.html",
  "web/dist/api.html",
]
sdist.exclude = [
  "tests/**",
  "*.DS_Store",
  "*.sh",
  "*.gz",
  "*.tar.gz",
  ".github",
  ".gitignore",
  "*.nix",
  ".envrc",
  "Makefile",
  "MANIFEST.in",
  "*test*",
  "temp*",
  ".clang-*",
  "*.lock",
  "*.venv*",
  "*venv*",
  "*.env",
  "*.egg-info",
  "DEVELOPERS_GUIDE.md",
  "DOCUMENTATION_SETUP.md",
  "docs",
  "Doxygen",
  ".readthedocs.yaml",
]

cmake.build-type = "Release"
cmake.args = [
  "-DDFTRACER_UTILS_BUILD_PYTHON=ON",
  "-DDFTRACER_UTILS_BUILD_SHARED=ON",
  "-DDFTRACER_UTILS_BUILD_STATIC=OFF",
  "-DDFTRACER_UTILS_BUILD_BINARIES=ON",
]

[tool.cibuildwheel]
build-verbosity = 1
# The build tree is not needed once the wheel exists, and the tests need the
# disk it holds on a 14 GB runner.
before-test = [
  "df -h {project}",
  "rm -rf {project}/build/ci",
  "df -h {project}",
  "pip install tomli",
  "python -c 'import tomli, subprocess, sys; subprocess.check_call([sys.executable, \"-m\", \"pip\", \"install\"] + tomli.load(open(\"pyproject.toml\", \"rb\"))[\"project\"][\"optional-dependencies\"][\"dev\"])'",
]
test-command = "pytest {project}/tests"
test-requires = "pytest numpy pandas pyarrow pytz>=2024.1,<2026"

# @note: enable this if you are using nix, see issue https://github.com/matthew-brett/delocate/issues/247
# [tool.cibuildwheel.macos]
# dependency-versions = { packages = ["delocate==0.12.0"] }

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.3"

[tool.ruff]
target-version = "py38"
line-length = 100
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These set and read attributes on classes and objects by a computed or
# decorator-attached name; the getattr/setattr form keeps the type checkers off
# attributes that do not exist on the declared type.
"python/dftracer/utils/_expr_ops.py" = ["B010"]
"python/dftracer/utils/_expr.py" = ["B010"]
"python/dftracer/utils/_pandas_series.py" = ["B009"]
"python/dftracer/utils/jit/*.py" = ["B009", "B010"]
"python/dftracer/utils/store/_codec.py" = ["B009"]
# Class-level annotations that typing.get_type_hints reads on Python 3.8, where
# `list[str]` and `X | None` fail when evaluated: the typing forms stay there.
"python/dftracer/utils/_build.py" = ["UP006", "UP007", "UP045"]
"python/dftracer/utils/_eval.py" = ["UP006", "UP007", "UP045"]
"python/dftracer/utils/_jit_errors.py" = ["UP006", "UP007", "UP045"]
"python/dftracer/utils/_pandas_frame.py" = ["UP006", "UP007", "UP045"]
"python/dftracer/utils/_polars_frame.py" = ["UP006", "UP007", "UP045"]
"python/dftracer/utils/dask/_index.py" = ["UP006", "UP007", "UP045"]
"python/dftracer/utils/dask/_viewer.py" = ["UP006", "UP007", "UP045"]
"python/dftracer/utils/_groupby.py" = ["UP006", "UP007", "UP045"]
"python/dftracer/utils/jit/_compiler.py" = ["UP006", "UP007", "UP045"]
"python/dftracer/utils/plugins.py" = ["UP006", "UP007", "UP045"]
"python/dftracer/utils/runtime.py" = ["UP006", "UP007", "UP045"]
"python/dftracer/utils/schemas.py" = ["UP006", "UP007", "UP045"]
"python/dftracer/utils/_series.py" = ["UP006", "UP007", "UP045"]
"python/dftracer/utils/store/_store.py" = ["UP006", "UP007", "UP045"]
# Annotations are required for the shipped package only. Tests build trace text
# with percent formats, probe lazy errors with bare expressions and loop for
# side effects, and assert on the broad Exception class where the native error
# type is not part of the contract.
"tests/**" = ["ANN", "B007", "B017", "B018", "UP031"]
"benchmarks/**" = ["ANN", "B018"]

[tool.ty.analysis]
# The optional dependencies are not installed in the checker's environment.
allowed-unresolved-imports = [
  "numpy", "numpy.**",
  "pandas", "pandas.**",
  "polars", "polars.**",
  "pyarrow", "pyarrow.**",
  "dask", "dask.**",
  "distributed", "distributed.**",
]

# The public classes override native methods whose engine form takes codes
# (cast, compare, rolling, ...) with the user-shaped spelling, until those
# methods take the user-shaped arguments natively.
[[tool.ty.overrides]]
include = [
  "python/dftracer/utils/_pandas_frame.py",
  "python/dftracer/utils/trace/_lazy.py",
  "python/dftracer/utils/_dataframe.py",
  "python/dftracer/utils/_expr.py",
  "python/dftracer/utils/_groupby.py",
  "python/dftracer/utils/_lazyframe.py",
  "python/dftracer/utils/_series.py",
  "python/dftracer/utils/trace/_viewer.py",
]

[tool.ty.overrides.rules]
incompatible-method-override = "ignore"
incompatible-property-override = "ignore"
lost-keyword-for-regular-parameter = "ignore"

# Comparison operators that build a mask or an expression, not a bool, as
# pandas and polars do.
[[tool.ty.overrides]]
include = [
  "python/dftracer/utils/dftracer_utils_ext.pyi",
  "python/dftracer/utils/duql/_col.py",
  "python/dftracer/utils/jit/_maps.py",
]

[tool.ty.overrides.rules]
incompatible-method-override = "ignore"

# `list[T_co | None]` as the return of a method of a covariant class.
[[tool.ty.overrides]]
include = [
  "python/dftracer/utils/dftracer_utils_ext.pyi",
  "python/dftracer/utils/_series.py",
]

[tool.ty.overrides.rules]
invalid-generic-class = "ignore"

# distributed is not installed in the checker's environment, so the worker
# plugin base class is unknown.
[[tool.ty.overrides]]
include = ["python/dftracer/utils/dask/_worker.py"]

[tool.ty.overrides.rules]
unsupported-base = "ignore"

[tool.mypy]
# `mypy --strict python/dftracer` (tests/python/test_package_typing.py) and the
# typed JIT fixtures (tests/python/test_jit_typing.py) read this table.
mypy_path = "python"
explicit_package_bases = true

# The optional dependencies are not installed in the checker's environment, so
# they are untyped here, once, instead of with an ignore comment per import.
[[tool.mypy.overrides]]
module = [
  "numpy", "numpy.*",
  "pandas", "pandas.*",
  "polars", "polars.*",
  "pyarrow", "pyarrow.*",
  "dask", "dask.*",
  "distributed", "distributed.*",
]
ignore_missing_imports = true

# distributed is not installed in the checker's environment, so the plugin base
# class is untyped here.
[[tool.mypy.overrides]]
module = "dftracer.utils.dask._worker"
disallow_subclassing_any = false

# The distributed Client methods (submit, gather, scatter, nthreads) are
# untyped upstream.
[[tool.mypy.overrides]]
module = "dftracer.utils.dask.*"
disallow_untyped_calls = false

# The public classes override native methods whose engine form takes codes
# (cast, compare, rolling, ...) with the user-shaped spelling, until those
# methods take the user-shaped arguments natively (same list as the ty
# overrides above).
[[tool.mypy.overrides]]
module = [
  "dftracer.utils._pandas_frame",
  "dftracer.utils.trace._lazy",
  "dftracer.utils._dataframe",
  "dftracer.utils._groupby",
  "dftracer.utils._lazyframe",
  "dftracer.utils._series",
  "dftracer.utils.trace._viewer",
  "dftracer.utils._expr",
  "dftracer.utils._enums",
  "dftracer.utils.duql._col",
]
disable_error_code = ["override"]

# The comparison operators of `Column` build a mask, and `Frame.__getitem__`
# overloads a Literal key before str; a native frame indexes by a name or by
# names, and a Series is also a sequence of names.
[[tool.mypy.overrides]]
module = ["dftracer.utils.jit._maps", "dftracer.utils.dftracer_utils_ext"]
disable_error_code = ["override", "overload-overlap"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
# no-guess-dev = {tag}.post1.dev{distance}: after the tag, but a pre-release,
# so `pip install` resolves to the last tag and only --pre reaches a develop
# build. A bare .postN is a final release and would be installed by default.
local_scheme = "no-local-version"
version_file = "python/dftracer/utils/_version.py"
fallback_version = "0.0.0"
