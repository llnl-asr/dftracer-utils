name: Package

# Called once per platform. Builds the C and C++ install layout with Release
# dependencies from the R2 bucket, and uploads it as a tarball.
on:
  workflow_call:
    inputs:
      os:
        description: The runner label of the platform.
        required: true
        type: string
      name:
        description: The platform name in the tarball, such as linux-x86_64.
        required: true
        type: string

jobs:
  package:
    name: C/C++ package on ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    permissions:
      contents: read
    env:
      SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: auto
      SCCACHE_IDLE_TIMEOUT: "0"
      SCCACHE_S3_USE_SSL: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpmsource
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select newer Xcode (macOS)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Set up sccache (macOS)
        if: runner.os == 'macOS'
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache CPM dependency sources
        uses: actions/cache@v5
        with:
          path: .cpmsource
          key: cpmsource-full-v1-${{ hashFiles('cmake/modules/Dependencies.cmake') }}
          restore-keys: |
            cpmsource-full-v1-

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Resolve the version
        run: |
          described=$(git describe --tags --long --match 'v*')
          tag=${described%-*-g*}
          distance=${described#"$tag"-}
          distance=${distance%-g*}
          tag=${tag#v}
          if [ "$distance" = "0" ]; then v="$tag"; else v="$tag.post$distance.dev0"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "ROCKSDB_VERSION=$(scripts/ci/rocksdb_version.sh)" >> "$GITHUB_ENV"

      - name: Restore dependency installs
        run: |
          mkdir -p .deps
          scripts/ci/deps_cache.sh restore wheel .deps

      - name: Build and pack (Linux)
        if: runner.os == 'Linux'
        run: |
          arch=$(uname -m)
          docker run --rm -v "$PWD:/project" -v "$PWD/.deps:/deps" -w /project \
            -e SCCACHE_BUCKET -e SCCACHE_ENDPOINT -e SCCACHE_REGION -e SCCACHE_IDLE_TIMEOUT \
            -e SCCACHE_S3_USE_SSL -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY \
            "quay.io/pypa/manylinux_2_28_${arch}:2025.11.09-2" bash -c '
              set -e
              git config --global --add safe.directory /project
              sh scripts/ci/install_sccache.sh
              sh scripts/ci/prebuild_wheel_deps.sh /deps
              export PATH=/opt/python/cp312-cp312/bin:$PATH
              scripts/ci/package.sh /deps "/project/package/dftracer-utils-${{ env.VERSION }}-${{ inputs.name }}.tar.gz"
            '
          sudo chown -R "$(id -u):$(id -g)" .deps package

      - name: Build and pack (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          DEPS_BUILD_TYPE: Release
          ZSTD_STATIC: "1"
        run: |
          for f in cmake ninja; do brew list --versions "$f" >/dev/null || brew install "$f"; done
          ROCKSDB_PREFIX="$PWD/.deps/rocksdb-$ROCKSDB_VERSION" scripts/ci/build_rocksdb.sh
          scripts/ci/package.sh "$PWD/.deps" "$PWD/package/dftracer-utils-$VERSION-${{ inputs.name }}.tar.gz"

      - name: Save dependency installs
        run: scripts/ci/deps_cache.sh save wheel .deps

      - uses: actions/upload-artifact@v6.0.0
        with:
          name: package-${{ inputs.name }}
          path: package/*.tar.gz

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
