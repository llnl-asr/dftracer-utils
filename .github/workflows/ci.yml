name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_all:
        description: Run every job, ignoring the changed-path filters.
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_all && 'true') || steps.filter.outputs.code }}
      coverage: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_all && 'true') || steps.filter.outputs.coverage }}
      web: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_all && 'true') || steps.filter.outputs.web }}
      rocksdb_version: ${{ steps.rocksdb.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve the pinned RocksDB version
        id: rocksdb
        run: echo "version=$(./scripts/ci/rocksdb_version.sh)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch' || !inputs.run_all
        with:
          filters: |
            code:
              - 'include/**'
              - 'src/**'
              - 'tests/**'
              - 'python/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'pyproject.toml'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - '.github/workflows/wheel.yml'
              - '.github/workflows/test.yml'
              - '.github/workflows/deps.yml'
              - '.github/workflows/valgrind.yml'
              - '.github/actions/**'
            coverage:
              - 'scripts/coverage.sh'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'



  # Tier 1, per platform: the dependency installs. Each platform's tests start
  # when its own installs are done, not when every platform's are.
  deps-ubuntu-22-04:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.coverage == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deps.yml
    secrets: inherit
    with:
      os: ubuntu-22.04
      rocksdb_version: ${{ needs.changes.outputs.rocksdb_version }}

  deps-ubuntu-22-04-arm:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.coverage == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deps.yml
    secrets: inherit
    with:
      os: ubuntu-22.04-arm
      rocksdb_version: ${{ needs.changes.outputs.rocksdb_version }}

  deps-ubuntu-24-04:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.coverage == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deps.yml
    secrets: inherit
    with:
      os: ubuntu-24.04
      rocksdb_version: ${{ needs.changes.outputs.rocksdb_version }}

  deps-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.coverage == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deps.yml
    secrets: inherit
    with:
      os: macos-latest
      rocksdb_version: ${{ needs.changes.outputs.rocksdb_version }}

  test-ubuntu-22-04:
    needs: [changes, deps-ubuntu-22-04]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.coverage == 'true'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      os: ubuntu-22.04
      shard_list: "[1,2,3,4]"
      shards: 4
      rocksdb_version: ${{ needs.changes.outputs.rocksdb_version }}

  test-single-ubuntu-22-04:
    needs: [changes, deps-ubuntu-22-04]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.coverage == 'true'
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-22.04
    env:
      ROCKSDB_VERSION: ${{ needs.changes.outputs.rocksdb_version }}
      CMAKE_POLICY_VERSION_MINIMUM: 3.5
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_ASM_COMPILER_LAUNCHER: sccache
      DFTRACER_UTILS_DEPS_PREFIX: ${{ github.workspace }}/.deps
      SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: auto
      SCCACHE_IDLE_TIMEOUT: "0"
      SCCACHE_S3_USE_SSL: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.12"

      - name: Prepare deps dir
        run: |
          sudo mkdir -p /opt/dftracer-deps
          sudo chown "$(id -u):$(id -g)" /opt/dftracer-deps

      - name: Restore RocksDB
        run: scripts/ci/deps_cache.sh restore rocksdb /opt/dftracer-deps

      - name: Use prebuilt RocksDB
        run: |
          prefix="/opt/dftracer-deps/rocksdb-${ROCKSDB_VERSION}"
          if [ -x "${prefix}/bin/ldb" ]; then
            echo "DFTRACER_UTILS_ROCKSDB_PREFIX=${prefix}" >> "$GITHUB_ENV"
          else
            echo "::warning::no prebuilt RocksDB at ${prefix}; building from source"
          fi

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Restore dependency installs
        run: scripts/ci/deps_cache.sh restore "ci-RelWithDebInfo" "$DFTRACER_UTILS_DEPS_PREFIX"

      - name: Cache CPM dependency sources
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.cpmsource
          key: cpmsource-lite-v1-${{ hashFiles('cmake/modules/Dependencies.cmake') }}
          restore-keys: |
            cpmsource-lite-v1-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake zlib1g-dev libsqlite3-dev pkg-config ninja-build

      - name: Run single library tests
        run: |
          ulimit -c unlimited || true
          make test-single

  test-ubuntu-22-04-arm:
    needs: [changes, deps-ubuntu-22-04-arm]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.coverage == 'true'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      os: ubuntu-22.04-arm
      shard_list: "[1,2,3]"
      shards: 3
      rocksdb_version: ${{ needs.changes.outputs.rocksdb_version }}

  test-ubuntu-24-04:
    needs: [changes, deps-ubuntu-24-04]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.coverage == 'true'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      os: ubuntu-24.04
      shard_list: "[1,2,3]"
      shards: 3
      rocksdb_version: ${{ needs.changes.outputs.rocksdb_version }}

  test-macos:
    needs: [changes, deps-macos]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.coverage == 'true'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      os: macos-latest
      shard_list: "[1,2,3,4]"
      shards: 4
      rocksdb_version: ${{ needs.changes.outputs.rocksdb_version }}

  valgrind:
    needs: [changes, deps-ubuntu-24-04]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/valgrind.yml
    secrets: inherit
    with:
      rocksdb_version: ${{ needs.changes.outputs.rocksdb_version }}

  coverage-finish:
    needs: [test-ubuntu-22-04, test-ubuntu-22-04-arm, test-ubuntu-24-04, test-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls finished
        uses: coverallsapp/github-action@v2.3.6
        continue-on-error: true
        with:
          parallel-finished: true
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI (embedded in dftracer_server)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Check web UI (typecheck, lint, test)
        working-directory: web
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Upload web bundle
        uses: actions/upload-artifact@v6.0.0
        with:
          name: web-dist
          path: web/dist/index.html
          retention-days: 1






  wheel-linux:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/wheel.yml
    with:
      os: ubuntu-22.04
    secrets: inherit

  wheel-linux-arm:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/wheel.yml
    with:
      os: ubuntu-22.04-arm
    secrets: inherit

  wheel-macos:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/wheel.yml
    with:
      os: macos-15
    secrets: inherit
